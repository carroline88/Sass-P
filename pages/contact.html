<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Genesis</title>
  <link rel="stylesheet" href="../styles/normalize.css">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="contact-container">
    <header class="navbar">
      <div class="logo"><a href="../index.html">Genesis</a></div>
      <nav class="nav-links">
        <a href="../index.html">Projects</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <section class="contact-hero">
      <div class="contact-intro">
        <h1 class="contact-title">Full set of great features to make your product fresh</h1>
        <p class="contact-desc">Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
      </div>

      <div class="contact-form-wrapper">
        <form class="contact-form">
          <div class="form-group">
            <input type="text" placeholder="Name" required>
          </div>
          <div class="form-group">
            <input type="email" placeholder="Email" required>
          </div>
          <div class="form-group">
            <textarea placeholder="Message" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn-submit">Submit</button>
        </form>
      </div>
    </section>

    
    <section class="contact-map">
      <img src="../images/map.png" alt="Map">
    </section>

    
    <footer class="footer">
      <div class="footer-logo">Genesis</div>
      <div class="footer-right">
        <div class="footer-links">
          <a href="../index.html">Projects</a>
          <a href="contact.html">Contact</a>
        </div>
        <div class="footer-social">
          <a href="#"><i class="fa-brands fa-dribbble"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
      </div>
    </footer>
  </div>

</body>
</html>
